spring:
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=DB_AuthService;trustServerCertificate=true
    username: sa
    password: sql
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

  jwt:
    secret: my-dev-secret-key
    access-expiration-millis: 300000       # 5 min
    refresh-expiration-millis: 900000      # 15 min