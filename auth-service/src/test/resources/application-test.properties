spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.initializationFailTimeout=-1

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Flyway en test
spring.flyway.enabled=true
spring.flyway.locations=classpath:test-db/migration
spring.flyway.schemas=dbo
spring.flyway.create-schemas=true
spring.flyway.connect-retries=60
spring.flyway.connect-retries-interval=10
