# Configuración SQL Server
spring.datasource.hikari.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:test-db/migration
spring.flyway.schemas=dbo

# Logging básico
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=test-secret-key-12345678901234567890123456789012
jwt.access-expiration-millis=900000
jwt.refresh-expiration-millis=3600000
