spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    defer-datasource-initialization: false

  flyway:
    enabled: false

jwt:
  secret: test-secret-key-12345678901234567890123456789012
  access-expiration-millis: 900000
  refresh-expiration-millis: 3600000
