spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false

# Logging para debug
logging:
  level:
    org.testcontainers: DEBUG
    com.miportal: DEBUG

jwt:
  secret: test-secret-key-12345678901234567890123456789012
  access-expiration-millis: 900000
  refresh-expiration-millis: 3600000
