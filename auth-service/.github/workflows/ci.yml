name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # Cambiar a PostgreSQL para coincidir con el proyecto
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_auth_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U test_user -d test_auth_db"
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      # Variables de entorno para tests
      - name: Set test environment variables
        run: |
          echo "SPRING_PROFILES_ACTIVE=test" >> $GITHUB_ENV

      - name: Build and run tests
        run: mvn -B -DskipTests=false verify

      - name: Generate Jacoco report
        run: mvn org.jacoco:jacoco-maven-plugin:report

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository }}/auth-service:${{ github.sha }} .

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository }}/auth-service:${{ github.sha }}