<div class="login-container">
  <div class="login-card">
    <h2 class="login-title">Iniciar Sesión</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      
      <!-- Campo Email -->
      <div class="form-group">
        <label for="email" class="form-label">Email:</label>
        <input 
          type="email" 
          id="email"
          formControlName="email"
          class="form-input"
          [class.error]="hasFieldError('email')"
          placeholder="Ingresa tu email"
        />
        <div *ngIf="hasFieldError('email')" class="error-message">
          {{ getFieldError('email') }}
        </div>
      </div>

      <!-- Campo Password -->
      <div class="form-group">
        <label for="password" class="form-label">Contraseña:</label>
        
        <input 
          type="password" 
          id="password"
          formControlName="password"
          class="form-input"
          [class.error]="hasFieldError('password')"
          placeholder="Ingresa tu contraseña"
        />
        <div *ngIf="hasFieldError('password')" class="error-message">
          {{ getFieldError('password') }}
        </div>
      </div>

      <!-- Mostrar error general de autenticación -->
      <!-- Solo se muestra si errorMessage no está vacío -->
      <div *ngIf="errorMessage" class="error-message error-general">
        {{ errorMessage }}
      </div>

      <!-- Botón de envío -->
      <button 
        type="submit" 
        class="login-button"
        [disabled]="isLoading"
      >
        {{ isLoading ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
      </button>

      <!-- Enlace para ir al registro -->
      <div class="register-link">
        <p>¿No tienes cuenta? 
          <span class="link" (click)="goToRegister()">Regístrate aquí</span>
        </p>
      </div>
    </form>
  </div>
</div>
